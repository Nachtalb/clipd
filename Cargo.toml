[package]
name = "clipd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CLIP image ranking over an API-key'd webhook"
repository = "https://github.com/Nachtalb/clipd"

[dependencies]
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls"] }
ndarray = "0.17"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
tiny_http = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
subtle = "2"
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
