name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - name: Fetch models
        run: ./scripts/fetch-models.sh

      - run: cargo test --release

      - name: Smoke test
        run: |
          cargo build --release
          ./scripts/smoke.sh
